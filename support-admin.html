<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문의관리 | 귀인사주</title><meta name="robots" content="noindex,nofollow"><script src="guiin-runtime-config.js?v=20260920prod1"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f7f5ef;margin:0;color:#222}main{max-width:900px;margin:auto;padding:20px}input,textarea,button,select{font:inherit}input,textarea,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:10px;background:#145743;color:white;font-weight:800}.card{background:#fff;border:1px solid #e6e1d8;border-radius:16px;padding:16px;margin:14px 0}.meta{font-size:12px;color:#777}.msg{white-space:pre-wrap;background:#faf8f3;padding:12px;border-radius:10px;margin:10px 0}.row{display:flex;gap:8px}.row>*{flex:1}</style></head><body><main><h1>귀인사주 문의관리</h1><div class="card"><label>SUPPORT_ADMIN_TOKEN</label><input id="token" type="password" autocomplete="off"><button style="margin-top:10px" onclick="loadList()">문의 불러오기</button></div><div id="list"></div></main><script>const FALLBACK_API='https://guiin-saju-api.blue-wls.workers.dev';function base(){try{return String(globalThis.GuiinRuntimeConfig?.apiBase?.()||FALLBACK_API).replace(/\/+$/,'')}catch(_){return FALLBACK_API}}function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadList(){const t=token.value.trim();sessionStorage.setItem('support_admin_token',t);const r=await fetch(base()+'/api/support/admin/inquiries?limit=100',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok){list.innerHTML='<div class="card">불러오기에 실패했습니다.</div>';return}list.innerHTML=(d.inquiries||[]).map(x=>`<div class="card"><b>${e(x.title)}</b><div class="meta">${e(x.id)} · ${e(x.category)} · ${e(x.status)} · ${e(x.created_at)}</div><div class="meta">${e(x.display_name||'')} ${e(x.contact_email||'')}</div><div class="msg">${e(x.message)}</div><textarea id="r_${e(x.id)}" placeholder="답변 입력">${e(x.reply||'')}</textarea><div class="row" style="margin-top:8px"><select id="s_${e(x.id)}"><option value="ANSWERED">답변 완료</option><option value="OPEN">접수 상태</option><option value="CLOSED">처리 종료</option></select><button onclick="reply('${e(x.id)}')">저장</button></div></div>`).join('')||'<div class="card">문의가 없습니다.</div>'}async function reply(id){const t=sessionStorage.getItem('support_admin_token')||token.value.trim();const r=await fetch(base()+'/api/support/admin/inquiries/'+encodeURIComponent(id)+'/reply',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({reply:document.getElementById('r_'+id).value,status:document.getElementById('s_'+id).value})});if(!r.ok)alert('저장 실패');else loadList()}token.value=sessionStorage.getItem('support_admin_token')||'';</script></body></html>
