<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>운영관리 | 귀인사주</title><script src="guiin-runtime-config.js?v=20260920prod1"></script><script src="guiin-production-guard-v6.27.js?v=20261004v627"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f7f5ef;margin:0;color:#222}main{max-width:980px;margin:auto;padding:20px}input,textarea,button,select{font:inherit}input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{padding:11px 14px;border:0;border-radius:10px;background:#145743;color:white;font-weight:800;min-height:44px}.secondary{background:#ece8df;color:#333}.danger{background:#9c4538}.card{background:#fff;border:1px solid #e6e1d8;border-radius:16px;padding:16px;margin:14px 0}.meta{font-size:12px;color:#777}.msg{white-space:pre-wrap;background:#faf8f3;padding:12px;border-radius:10px;margin:10px 0;overflow:auto}.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}.statusgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.statusitem{padding:12px;border-radius:12px;background:#f8f6ef}.statusitem b{display:block;font-size:11px;color:#777}.statusitem span{display:block;margin-top:4px;font-weight:900;word-break:break-word}.ok{color:#23623c}.warn{color:#926313}.bad{color:#a04435}.out{white-space:pre-wrap;font-size:12px;background:#111;color:#eee;padding:12px;border-radius:10px;max-height:360px;overflow:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:800;margin:8px 0 5px}@media(max-width:650px){.statusgrid,.grid2{grid-template-columns:1fr}.row{display:block}.row>*{margin-top:8px}}</style></head><body><main><h1>귀인사주 운영관리</h1><div class="card"><div class="row"><div><h3 style="margin:0 0 6px">서비스 상태</h3><div class="meta">공개 health 값 기준. 실결제는 모든 게이트를 통과하기 전까지 열지 마.</div></div><button style="flex:0 0 auto" onclick="loadHealth()">상태 새로고침</button></div><div id="health" class="statusgrid" style="margin-top:10px"></div></div>
<div class="card"><label>SUPPORT_ADMIN_TOKEN</label><input id="token" type="password" autocomplete="off"><div class="meta">이 토큰은 이 탭의 sessionStorage에만 저장돼.</div></div>
<div class="grid2"><div class="card"><h2>주문 조회·복구</h2><label>주문번호</label><input id="orderId" placeholder="order_..."><div class="row" style="margin-top:8px"><button onclick="lookupOrder()">주문 조회</button><button class="secondary" onclick="recoverOrder()">토스 승인 복구</button></div><div id="orderOut" class="out" style="margin-top:10px">-</div></div><div class="card"><h2>환불</h2><div class="meta">환불은 실제 돈이 움직이는 작업이야. 주문을 먼저 조회하고 미사용 질문 수를 확인해.</div><label>환불 사유</label><input id="refundReason" value="고객 요청 환불"><label>환불 금액(원)</label><input id="refundAmount" type="number" min="1" placeholder="예: 1100"><label>회수할 AI 질문 수</label><input id="revokeUses" type="number" min="0" placeholder="평생사주/궁합은 0"><button class="danger" style="margin-top:10px" onclick="refundOrder()">환불 실행</button><div id="refundOut" class="out" style="margin-top:10px">-</div></div></div>
<div class="card"><div class="row"><div><h2 style="margin:0">결제 정합성 검사</h2><div class="meta">검증된 결제인데 권한 지급이 안 된 건, 환불 처리 중인 건을 찾아 기록해.</div></div><button style="flex:0 0 auto" onclick="runRecon()">검사 실행</button></div><div id="reconOut" class="out" style="margin-top:10px">-</div></div>
<h2>문의관리</h2><div class="card"><button onclick="loadList()">문의 불러오기</button></div><div id="list"></div></main><script>
const FALLBACK_API='https://guiin-saju-api.blue-wls.workers.dev';
function base(){try{return String(globalThis.GuiinRuntimeConfig?.apiBase?.()||FALLBACK_API).replace(/\/+$/,'')}catch(_){return FALLBACK_API}}
function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function adminToken(){const t=token.value.trim();if(t)sessionStorage.setItem('support_admin_token',t);return t||sessionStorage.getItem('support_admin_token')||''}
function headers(json=false,idem=false){const h={Authorization:'Bearer '+adminToken(),Accept:'application/json'};if(json)h['Content-Type']='application/json';if(idem)h['X-Idempotency-Key']='admin_'+crypto.randomUUID();return h}
async function jfetch(path,opt={}){const r=await fetch(base()+path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function print(id,x){document.getElementById(id).textContent=JSON.stringify(x,null,2)}
async function loadHealth(){const v=document.getElementById('health');v.innerHTML='<div class="statusitem"><b>확인 중</b><span>불러오는 중…</span></div>';try{const d=await jfetch('/health',{cache:'no-store'});const item=(k,val,cls='')=>`<div class="statusitem"><b>${e(k)}</b><span class="${cls}">${e(val)}</span></div>`;v.innerHTML=item('Worker',d.version||'-')+item('AI',d.chatEnabled?'정상':'확인 필요',d.chatEnabled?'ok':'bad')+item('DB',d.databaseReady?'정상':'확인 필요',d.databaseReady?'ok':'bad')+item('서버 사용량',d.serverAccountingReady?'정상':'미준비',d.serverAccountingReady?'ok':'warn')+item('AI 이용권 스키마',d.aiPassGrantSchemaReady?'정상':'마이그레이션 필요',d.aiPassGrantSchemaReady?'ok':'warn')+item('상품',d.productCatalogReady?'정상':'확인 필요',d.productCatalogReady?'ok':'warn')+item('PG',`${d.pgProvider||'-'} · ${d.tossKeyMode||'-'}`)+item('실결제',d.liveCheckoutReady?'활성':'비활성/테스트',d.liveCheckoutReady?'ok':'warn')+item('테스트결제',d.tossTestCheckoutReady?'가능':'비활성',d.tossTestCheckoutReady?'ok':'warn')+item('런치게이트',d.paymentLaunchReady?'통과':'미통과',d.paymentLaunchReady?'ok':'warn')+item('런타임',d.runtimeMode||'-');}catch(err){v.innerHTML='<div class="statusitem"><b>오류</b><span class="bad">'+e(err.message)+'</span></div>'}}
async function lookupOrder(){try{const id=orderId.value.trim();if(!id)throw new Error('주문번호를 입력해');print('orderOut',await jfetch('/api/support/admin/orders/'+encodeURIComponent(id),{headers:headers()}))}catch(e){print('orderOut',{error:e.message})}}
async function recoverOrder(){try{const id=orderId.value.trim();if(!id)throw new Error('주문번호를 입력해');if(!confirm('토스 결제 상태를 다시 조회해서 미지급 권한을 복구할까?'))return;print('orderOut',await jfetch('/api/support/admin/orders/'+encodeURIComponent(id)+'/recover',{method:'POST',headers:headers(true),body:'{}'}))}catch(e){print('orderOut',{error:e.message})}}
async function refundOrder(){try{const id=orderId.value.trim();if(!id)throw new Error('주문번호를 먼저 입력해');const amount=Number(refundAmount.value||0),uses=Number(revokeUses.value||0);if(!amount)throw new Error('환불 금액을 입력해');if(!confirm(`주문 ${id}에 ${amount.toLocaleString()}원을 실제 환불할까? 이 작업은 되돌리기 어려워.`))return;const body={reason:refundReason.value.trim()||'고객 요청 환불',cancelAmount:amount,revokeUses:uses};print('refundOut',await jfetch('/api/support/admin/orders/'+encodeURIComponent(id)+'/refund',{method:'POST',headers:headers(true,true),body:JSON.stringify(body)}));await lookupOrder()}catch(e){print('refundOut',{error:e.message})}}
async function runRecon(){try{print('reconOut',await jfetch('/api/support/admin/reconciliation/run',{method:'POST',headers:headers(true),body:'{}'}))}catch(e){print('reconOut',{error:e.message})}}
async function loadList(){try{const d=await jfetch('/api/support/admin/inquiries?limit=100',{headers:headers()});list.innerHTML=(d.inquiries||[]).map(x=>`<div class="card"><b>${e(x.title)}</b><div class="meta">${e(x.id)} · ${e(x.category)} · ${e(x.status)} · ${e(x.created_at)}</div><div class="meta">${e(x.display_name||'')} ${e(x.contact_email||'')}</div><div class="msg">${e(x.message)}</div><textarea id="r_${e(x.id)}">${e(x.reply||'')}</textarea><div class="row" style="margin-top:8px"><select id="s_${e(x.id)}"><option value="ANSWERED">답변 완료</option><option value="OPEN">접수 상태</option><option value="CLOSED">처리 종료</option></select><button onclick="reply('${e(x.id)}')">저장</button></div></div>`).join('')||'<div class="card">문의가 없어.</div>'}catch(e){list.innerHTML='<div class="card bad">'+e.message+'</div>'}}
async function reply(id){try{await jfetch('/api/support/admin/inquiries/'+encodeURIComponent(id)+'/reply',{method:'POST',headers:headers(true),body:JSON.stringify({reply:document.getElementById('r_'+id).value,status:document.getElementById('s_'+id).value})});loadList()}catch(e){alert('저장 실패: '+e.message)}}
token.value=sessionStorage.getItem('support_admin_token')||'';loadHealth();
</script></body></html>
