<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<title>귀인사주 Production AI Smoke Test</title>
<style>
:root{--bg:#fffaf1;--paper:#fffefa;--ink:#203128;--sub:#7c837d;--green:#0b6b4f;--line:#ece5d7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 28px rgba(62,53,40,.08)}
h1{font-size:22px;margin:0 0 10px;color:var(--green)}
p{color:var(--sub);line-height:1.6;font-size:14px}
button{width:100%;border:0;border-radius:14px;padding:15px;background:var(--green);color:white;font-weight:900;font-size:16px}
button:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;background:#f4f7f2;border-radius:14px;padding:14px;font-size:12px;line-height:1.55;min-height:120px}
.ok{color:#17603d}.bad{color:#9a3e35}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🍀 Production AI 연결 테스트</h1>
    <p>현재 사이트를 Production으로 전환하지 않고, 저장된 Production 로그인 세션으로 Production Worker의 /api/me와 /api/chat만 검사합니다.</p>
    <button id="run">테스트 시작</button>
    <pre id="out">대기 중…</pre>
  </div>
</div>
<script>
(function(){
  'use strict';
  const API='https://guiin-saju-api.blue-wls.workers.dev';
  const KEY='guiin_user_session_production_v1';
  const btn=document.getElementById('run');
  const out=document.getElementById('out');

  function log(v, cls){
    out.className=cls||'';
    out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);
  }

  function readSession(){
    try{
      const raw=localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null';
      const s=JSON.parse(raw);
      return s&&typeof s.token==='string'&&s.token.startsWith('usr_')?s:null;
    }catch(_e){return null;}
  }

  async function jsonFetch(path,opt){
    const r=await fetch(API+path,opt);
    const d=await r.json().catch(()=>({}));
    return {r,d};
  }

  btn.addEventListener('click',async()=>{
    btn.disabled=true;
    log('1/2 Production 로그인 세션 확인 중…');

    const s=readSession();
    if(!s){
      log('Production 로그인 세션이 없습니다. 먼저 Production 카카오 로그인 테스트를 다시 완료해 주세요.','bad');
      btn.disabled=false;
      return;
    }

    try{
      const me=await jsonFetch('/api/me',{
        method:'GET',
        mode:'cors',
        cache:'no-store',
        headers:{'Accept':'application/json','Authorization':'Bearer '+s.token}
      });

      if(!me.r.ok||me.d.authenticated!==true){
        log({step:'api/me',ok:false,status:me.r.status,error:me.d.error||'session_verify_failed'},'bad');
        btn.disabled=false;
        return;
      }

      log('2/2 Production AI 호출 중…');

      const idem='prod_smoke_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2));
      const body={
        requestId:idem,
        name:'Production Smoke Test',
        message:'Production AI 연결 테스트입니다. 서버 연결이 정상인지 짧게 한 문장으로 확인해 주세요.',
        chart:{
          schema_version:'2.0.0',
          pillars:{year:'甲子',month:'乙丑',day:'丙寅',hour:'丁卯'},
          day_master:{stem:'丙'},
          element_distribution:{wood:2,fire:2,earth:1,metal:0,water:1},
          uncertainty:{smoke_test:true}
        },
        history:[]
      };

      const chat=await jsonFetch('/api/chat',{
        method:'POST',
        mode:'cors',
        cache:'no-store',
        headers:{
          'Accept':'application/json',
          'Content-Type':'application/json',
          'Authorization':'Bearer '+s.token,
          'X-Idempotency-Key':idem
        },
        body:JSON.stringify(body)
      });

      const summary={
        productionSession:true,
        apiMeAuthenticated:true,
        chatHttpStatus:chat.r.status,
        chatOk:!!chat.d.ok,
        model:chat.d.model||null,
        durableResultStored:chat.d.durableResultStored??null,
        serverCharged:chat.d.serverCharged??null,
        chargeSource:chat.d.chargeSource??null,
        answer:chat.d.answer||null,
        error:chat.d.error||null,
        requestId:chat.d.requestId||null
      };

      log(summary, chat.r.ok&&chat.d.ok?'ok':'bad');
    }catch(e){
      log({ok:false,error:String(e&&e.message||e||'network_error')},'bad');
    }finally{
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
