<!doctype html>
<html lang="ko">
<head>

<title>귀인사주 | Guiin Saju</title>
<style>
:root{--bg:#13090c;--panel:#241116;--panel2:#32171e;--wine:#6d2637;--wine2:#431722;--gold:#e1b85c;--gold2:#f2d88e;--ink:#f7efe8;--muted:#bca9a4;--line:rgba(225,184,92,.20);--danger:#d77f86}
*{box-sizing:border-box}html{background:#080406}body{margin:0;background:radial-gradient(800px 420px at 50% -80px,#5d2230 0%,#241015 45%,var(--bg) 75%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:82px}
button,input,select{font:inherit}.app{max-width:430px;margin:auto;min-height:100vh;padding:0 15px 28px}.top{height:72px;display:flex;align-items:center;justify-content:space-between}.brand b{font-family:Georgia,serif;color:var(--gold2);font-size:23px}.brand small{display:block;text-align:center;color:#9d8785;font-size:8px;letter-spacing:.18em}.top .mark{color:var(--gold);font-size:22px}
.screen{display:none}.screen.on{display:block}.hero{background:linear-gradient(145deg,#6e2638,#32121b);border:1px solid var(--line);border-radius:26px;padding:25px 21px;box-shadow:0 16px 38px rgba(0,0,0,.18)}.hero small,.eyebrow{color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.08em}.hero h1{font-size:28px;line-height:1.3;margin:8px 0 10px}.hero p{font-size:13px;line-height:1.7;color:#d8c8c4}.hero .cta{margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.menu,.card{background:linear-gradient(160deg,rgba(55,25,32,.98),rgba(31,14,19,.98));border:1px solid var(--line);border-radius:20px;color:var(--ink)}.menu{padding:17px;text-align:left;min-height:130px}.menu i{font-style:normal;color:var(--gold);font-size:20px}.menu b{display:block;margin:13px 0 5px}.menu span{color:var(--muted);font-size:11px;line-height:1.55}.card{padding:17px;margin:11px 0}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted);font-size:12px;line-height:1.7}.back{border:0;background:none;color:var(--gold2);padding:8px 0 14px}.sec{font-size:25px;margin:0 0 14px}.row{display:grid;gap:8px}.y2{grid-template-columns:1fr 1fr}.y3{grid-template-columns:1.3fr .8fr .8fr}label{display:block;color:#cbbab5;font-size:11px;margin:13px 0 6px}input,select{width:100%;border:1px solid var(--line);background:#190c10;color:var(--ink);border-radius:14px;padding:13px;outline:none}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button{border:1px solid var(--line);background:#190c10;color:var(--muted);border-radius:13px;padding:11px}.seg button.on{background:var(--wine);color:white;border-color:#8d3c4e}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}
.btn{width:100%;border:0;border-radius:15px;padding:14px;font-weight:900}.gold{background:linear-gradient(90deg,#d4a94b,#f1d27e);color:#2a1418}.ghost{background:#2a141a;color:var(--gold2);border:1px solid var(--line)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pillar{background:#190c10;border:1px solid var(--line);border-radius:15px;padding:11px 4px;text-align:center}.pillar small{color:#9d8985}.pillar strong{display:block;color:var(--gold2);font-size:22px;margin:5px 0}.pillar span{font-size:10px;color:#c8b5b0}.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:24px 1fr 34px;gap:8px;align-items:center;font-size:11px}.bar{height:8px;background:#12090c;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9f6b78,var(--gold))}
.previewline{border-top:1px solid var(--line);padding:13px 0}.previewline:last-child{border-bottom:0}.previewline b{color:var(--gold2)}.luckstrip{display:flex;gap:7px;overflow:auto}.luckpill{min-width:92px;background:#190c10;border:1px solid var(--line);border-radius:14px;padding:11px}.luckpill.now{border-color:var(--gold);background:#3b1922}.luckpill b{color:var(--gold2)}.luckpill span{display:block;font-size:10px;color:var(--muted);margin-top:5px}
.paid{position:relative;overflow:hidden}.paid.locked .paidbody{filter:blur(4px);max-height:240px;overflow:hidden;user-select:none}.paid.locked:after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(transparent,#1e0e13)}.unlock{position:relative;z-index:3;margin-top:-55px;background:#3b1822;border:1px solid rgba(225,184,92,.35);border-radius:18px;padding:15px;text-align:center}.unlock b{display:block;color:var(--gold2)}.unlock small{display:block;color:#bdaaa5;margin:5px 0 11px}.six{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{background:#190c10;border:1px solid var(--line);border-radius:16px;padding:13px}.detail b{color:var(--gold2);font-size:12px}.detail p{font-size:12px;line-height:1.75;color:#d9c9c5;margin:7px 0 0}.report p{font-size:13px;line-height:1.85;color:#ddcfcb}.subhead{color:var(--gold2);font-size:16px;margin:18px 0 7px}.disclaimer{font-size:10px;line-height:1.65;color:#907e7b;border-top:1px solid var(--line);padding:16px 2px 2px;margin-top:18px}
.score{font-size:48px;color:var(--gold2);font-weight:900}.relchips{display:flex;gap:6px;flex-wrap:wrap}.relchips span{border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:#d7c4bf;font-size:10px}.saveditem{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 0}.saveditem button{width:auto;padding:8px 11px}
.lockonly{opacity:.65}.lockonly h3:before{content:"🔒 ";font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,7,9,.96);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}nav .inner{max-width:430px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}nav button{border:0;background:none;color:#8f7d7a;padding:10px 0 8px;font-size:11px}nav button.on{color:var(--gold2)}nav button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}

.product-card{border:0;border-radius:20px;padding:16px 12px 12px;min-height:164px;text-align:left;color:#202537;position:relative}.product-card:nth-child(1){background:#fff0bd}.product-card:nth-child(2){background:#f8dfe2}.product-card:nth-child(3){background:#e9dcfa}.product-card i{font-style:normal;font-size:25px}.product-card b{display:block;font-size:16px;margin:14px 0 5px}.product-card span{display:block;color:#686878;font-size:10px;line-height:1.5}.product-card em{position:absolute;right:9px;top:10px;background:rgba(255,255,255,.62);border-radius:999px;padding:5px 7px;font-style:normal;font-size:10px;color:#b07878;font-weight:900}.product-card .mini{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;background:rgba(255,255,255,.68);border-radius:999px;padding:7px 4px;font-size:10px;font-weight:900}
body.home-mode #home>.card{background:#fffdf8;border:1px solid #eee7db;color:#202537;box-shadow:none}body.home-mode #home .muted{color:#817b72}body.home-mode #home .lockonly{display:none}
.home-note{margin-top:12px;background:#f3eee4;border-radius:16px;padding:12px 14px;color:#6e6048;font-size:11px;line-height:1.55;border:1px solid #ece2d1}.home-note b{color:#8a6d20}
body.home-mode nav{background:rgba(255,255,255,.97);border-top:1px solid #eee8de}body.home-mode nav button{color:#9b9a96}body.home-mode nav button.on{color:#b98c16}
@media(max-width:370px){.home-products{grid-template-columns:1fr}.product-card{min-height:120px}}

@media(max-width:370px){.app{padding-left:11px;padding-right:11px}.six{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style>

<body class="home-mode">
<div class="app">
<header class="top"><div class="mark">✦</div><div class="brand"><b>귀인사주</b><small>GUIIN SAJU</small></div><div class="mark">☾</div></header>

<section id="home" class="screen on">
 <div class="home-profile"><div class="home-avatar">☘</div><div><b>귀인사주 프로필</b><small id="homeProfileText">저장된 프로필을 선택해 보세요</small></div><div class="choose">프로필 ›</div></div>
 <div class="hero"><small>내 사주를 알고, 현실의 선택을 읽는 리포트</small><h1>귀인사주</h1><p>무료 명식부터 990원 상세 리포트까지. 원국·대운·세운의 근거를 과장 없이 풀어드립니다.</p><button class="btn gold cta" onclick="go('saju')">무료 명식 보기 ›</button></div>
 <div class="home-products">
  <button class="product-card" onclick="go('saju')"><i>☀️</i><b>오늘의 운세</b><span>명식과 올해 흐름에서 오늘의 체크포인트를 짧게</span><div class="mini">무료 명식부터 ›</div></button>
  <button class="product-card" onclick="go('saju')"><em>990원</em><i>📜</i><b>평생사주</b><span>성격·직업·재물·연애·건강과 대운 상세</span><div class="mini">내 사주 전체 보기 ›</div></button>
  <button class="product-card" onclick="go('match')"><em>2,900원 예정</em><i>💜</i><b>우리 궁합</b><span>두 명식의 점수와 합·충 신호를 먼저 무료로</span><div class="mini">궁합 보기 ›</div></button>
 </div>
 <div class="home-note"><b>☘ 좋은 인연이, 좋은 운을 만듭니다.</b><br>지금은 실제 결제 없이 990원 상세 리포트의 데모 잠금 해제까지 테스트할 수 있습니다.</div>
 <div class="card"><h3>저장 프로필</h3><div id="savedList" class="muted">아직 저장된 프로필이 없습니다.</div></div>

 <button class="back" onclick="go('home')">← 홈</button><h2 class="sec">사주 입력</h2>

  <div style="height:14px"></div><button class="btn gold" onclick="submitMatch()">무료 궁합 보기</button>
 </div>

<script src="saju-engine.js"></script>
<script>
const $=id=>document.getElementById(id);
const STORE="guiin-saju", PREMIUM="guiin-saju-premium";
let gender="여", LAST=null;
const STEM_EL={갑:"목",을:"목",병:"화",정:"화",무:"토",기:"토",경:"금",신:"금",임:"수",계:"수"};
const BR_EL={자:"수",축:"토",인:"목",묘:"목",진:"토",사:"화",오:"화",미:"토",신:"금",유:"금",술:"토",해:"수"};
const STEM_YANG=new Set(["갑","병","무","경","임"]);
const STEM_COMB={갑:"기",기:"갑",을:"경",경:"을",병:"신",신:"병",정:"임",임:"정",무:"계",계:"무"};
const BR_COMB={자:"축",축:"자",인:"해",해:"인",묘:"술",술:"묘",진:"유",유:"진",사:"신",신:"사",오:"미",미:"오"};
const BR_CLASH={자:"오",오:"자",축:"미",미:"축",인:"신",신:"인",묘:"유",유:"묘",진:"술",술:"진",사:"해",해:"사"};
const yearNow=new Date().getFullYear();

document.querySelectorAll("#genderSeg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#genderSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");gender=b.dataset.v});
$("hourUnknown").onchange=()=>{$("hour").disabled=$("minute").disabled=$("hourUnknown").checked};

function go(id){document.body.classList.toggle("home-mode",id==="home");document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));$("tab-"+id)?.classList.add("on");window.scrollTo(0,0);if(id==="home")renderSaved()}
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch(e){return[]}}
function saveProfile(inp,c){let x=loadSaved().filter(p=>p.name!==inp.name);x.unshift({...inp,dayMaster:c.dayMaster.stem});localStorage.setItem(STORE,JSON.stringify(x.slice(0,12)));renderSaved()}
function renderSaved(){const x=loadSaved();$("savedList").innerHTML=x.length?x.map((p,i)=>`<div class="saveditem"><div><b>${esc(p.name)}</b><div class="muted">${p.year}.${p.month}.${p.day} · ${p.gender} · ${p.dayMaster}일간</div></div><button class="btn ghost" onclick="openSaved(${i})">보기</button></div>`).join(""):"아직 저장된 프로필이 없습니다.";const hp=$("homeProfileText");if(hp)hp.textContent=x.length?`${x[0].name} · ${x[0].year}.${String(x[0].month).padStart(2,"0")}.${String(x[0].day).padStart(2,"0")} · ${x[0].dayMaster}일간`:"저장된 프로필을 선택해 보세요"}
function openSaved(i){const p=loadSaved()[i];if(!p)return;go("saju");["name","year","month","day","hour","minute"].forEach(k=>$(k).value=p[k]??"");$("hourUnknown").checked=!!p.hourUnknown;gender=p.gender||"여";document.querySelectorAll("#genderSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===gender));submitSaju()}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function calc(inp){return GuiinSaju.calculate(inp)}
function age(c){return Math.max(0,yearNow-c.input.year)}
function currentLuck(c){const a=age(c);return c.luck.find(x=>a>=x.fromAge&&a<=x.toAge)||c.luck[0]}
function elPct(c){return GuiinSaju.normalizeEl(c.elCount)}
function strongest(p){return Object.keys(p).sort((a,b)=>p[b]-p[a])[0]}
function weakest(p){return Object.keys(p).sort((a,b)=>p[a]-p[b])[0]}
function relationSignals(c,p){const vals=Object.values(c.pillars).filter(Boolean),out=[];for(const n of vals){if(STEM_COMB[p.stem]===n.stem)out.push(`${p.stem}${n.stem} 천간합`);if(BR_COMB[p.branch]===n.branch)out.push(`${p.branch}${n.branch} 육합`);if(BR_CLASH[p.branch]===n.branch)out.push(`${p.branch}${n.branch} 충`)}return [...new Set(out)]}
function pillarHTML(title,p){return p?`<div class="pillar"><small>${title}</small><strong>${p.hanja}</strong><span>${p.ko}${p.god?` · ${p.god}`:""}</span></div>`:`<div class="pillar"><small>${title}</small><strong>?</strong><span>시간 모름</span></div>`}

function dmVoice(dm,god){
 const el=STEM_EL[dm], yang=STEM_YANG.has(dm);
 const nature={목:"성장과 방향",화:"표현과 추진",토:"안정과 축적",금:"기준과 정리",수:"정보와 유연성"}[el];
 const godText={
 비견:"내 기준과 독립성이 강해지는",겁재:"경쟁과 자원 배분을 다시 보는",식신:"꾸준한 생산성과 생활력을 결과로 바꾸는",상관:"기존 방식에 질문하고 표현을 넓히는",
 편재:"외부 기회와 거래의 폭이 커지는",정재:"현금흐름과 생활 기반을 정돈하는",편관:"압박과 책임을 실력으로 전환하는",정관:"자리·규칙·신뢰를 다지는",편인:"새 관점과 전문성을 깊게 파는",정인:"배움·문서·보호 자원을 활용하는"
 }[god]||"생활의 우선순위를 재조정하는";
 return `${dm}일간의 ${nature} 성향에 ${godText} 흐름이 겹칩니다. ${yang?"먼저 움직여 반응을 확인하는 방식":"조건을 살피고 정교하게 조정하는 방식"}이 더 자연스럽지만, 원국 전체와 현실 조건을 함께 봐야 합니다.`;
}
function luckSix(c,p){
 const dm=c.dayMaster.stem,g=p.god,pct=elPct(c),hi=strongest(pct),lo=weakest(pct),rel=relationSignals(c,p);
 const base=dmVoice(dm,g);
 const map={
