# 귀인사주 Cloudflare Worker 배포 예시
# 이 파일은 예시입니다. database_id는 Cloudflare에서 D1 생성 후 실제 값으로 교체하세요.
# OPENAI_API_KEY 같은 비밀키는 절대로 이 파일에 적지 마세요.

name = "guiin-saju-api"
main = "worker-v4-integrated-preview.js"
compatibility_date = "2026-09-01"

[vars]
AI_CHAT_ENABLED = "true"
CHAT_MODEL = "gpt-4o-mini"

[[d1_databases]]
binding = "DB"
database_name = "guiin-saju-db"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"

# 선택 사항: AI 답변 재전송 방지 KV.
# Cloudflare에서 KV를 만든 뒤 아래 주석을 해제하고 id를 실제 값으로 바꾸세요.
# [[kv_namespaces]]
# binding = "AI_IDEMPOTENCY"
# id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"
