name: optimize-images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"

permissions:
  contents: write

jobs:
  webp:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Install webp
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert JPG/PNG to WebP
        run: |
          set -e
          shopt -s nullglob
          for f in *.jpg *.jpeg *.png; do
            [ -f "$f" ] || continue
            out="${f%.*}.webp"
            cwebp -quiet -q 78 -m 6 "$f" -o "$out"
            echo "made $out ($(wc -c < "$out") bytes) from $f ($(wc -c < "$f") bytes)"
          done
      - name: Commit WebP if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A *.webp
          if git diff --cached --quiet; then
            echo "no webp changes"
          else
            git commit -m "chore: optimize images to webp"
            git push
          fi
