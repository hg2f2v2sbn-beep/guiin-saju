name: site-check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          set -e
          for f in \
            index.html saju-engine.js saju-engine-v2-patch.js guiin-engine-contract.js guiin-quality-gate.js \
            guiin-runtime-v2.css flow-v2.js expert-interpreter.js expert-v2.js compatibility-interpreter.js \
            compatibility-v2.js worker.js worker-v4.9-launch-gate-preview.js worker-v5.0-account-link-preview.js \
            server-schema.sql server-d1-init.sql server-account-link.js server-account-link-migration-v1.sql \
            guiin-server-client.js guiin-server-data-client.js guiin-frontend-bridge.js ACCOUNT-LINK-RESTORE.md \
            launch-gate-matrix.json failure-safety-matrix.json golden-chart.test.js engine-v2-contract.test.js \
            ai-counsel-v2-regression.test.js server-money-regression.test.js \
            payment-entitlement-regression.test.js payment-recovery-regression.test.js \
            security-hardening-regression.test.js security-hardening-v2-regression.test.js \
            reliability-regression.test.js launch-gate-e2e.test.js frontend-server-bridge-regression.test.js \
            account-link-regression.test.js account-link-schema-regression.test.js \
            worker-v5.0-account-link-regression.test.js frontend-account-restore-regression.test.js \
            server-data-crud.js worker-v5.1-data-crud-preview.js data-crud-regression.test.js \
            worker-v5.1-data-crud-regression.test.js data-client-v2-regression.test.js account-link-smoke.py \
            data-crud-smoke.py DATA-CRUD-V1.md today.html manse.html compatibility.html sitemap.xml robots.txt \
            CNAME brand-home.jpg server-login-foundation-migration-v1.sql server-login-foundation.js \
            server-logout.js worker-v5.2-login-foundation-preview.js guiin-login-bridge.js \
            LOGIN-FOUNDATION-V1.md login-foundation-regression.test.js \
            login-foundation-schema-regression.test.js worker-v5.2-login-foundation-regression.test.js \
            frontend-login-bridge-regression.test.js login-foundation-smoke.py server-guest-conversion.js \
            cloudflare-staging-config.js worker-v5.3-staging-preview.js wrangler.staging.example.toml \
            staging-readiness-manifest.json CLOUDFLARE-STAGING-V1.md staging-config-regression.test.js \
            worker-v5.3-staging-regression.test.js guest-conversion-compat-regression.test.js \
            staging-init-smoke.py server-authority-transition-migration-v1.sql server-authority-transition.js \
            guiin-authority-bridge.js worker-v5.4-authority-transition-preview.js AUTHORITY-TRANSITION-V1.md \
            authority-transition-regression.test.js frontend-authority-bridge-regression.test.js \
            worker-v5.4-authority-regression.test.js authority-schema-regression.test.js \
            authority-transition-smoke.py server-pg-test-migration-v1.sql server-pg-adapter.js \
            server-webhook-signature.js worker-v5.5-pg-test-preview.js PG-TEST-WEBHOOK-V1.md \
            pg-test-regression.test.js webhook-signature-regression.test.js worker-v5.5-pg-regression.test.js \
            pg-schema-regression.test.js pg-test-smoke.py server-legal-migration-v1.sql \
            server-legal-readiness.js worker-v5.6-legal-failure-gate-preview.js TERMS-DRAFT-V1.md \
            PRIVACY-DRAFT-V1.md REFUND-DRAFT-V1.md LEGAL-SOURCE-NOTES.md LEGAL-FAILURE-GATE-V1.md \
            legal-readiness-status.json failure-safety-matrix-v2-100.json legal-readiness-regression.test.js \
            legal-docs-regression.test.js failure-scenario-regression.test.js \
            worker-v5.6-legal-regression.test.js legal-schema-regression.test.js legal-smoke.py \
            server-final-launch-migration-v1.sql server-final-launch-gate.js worker-v6.0-final-launch-preview.js \
            30-stage-completion.json FINAL-LAUNCH-STATUS.json FINAL-LAUNCH-GATE-V1.md \
            final-launch-gate-regression.test.js final-stage-regression.test.js final-status-regression.test.js \
            worker-v6-final-regression.test.js final-schema-regression.test.js final-launch-smoke.py
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
      - name: JavaScript syntax check
        run: |
          set -e
          for f in \
            saju-engine.js saju-engine-v2-patch.js guiin-engine-contract.js guiin-quality-gate.js flow-v2.js \
            expert-interpreter.js expert-v2.js compatibility-interpreter.js compatibility-v2.js worker.js \
            worker-v4.9-launch-gate-preview.js worker-v5.0-account-link-preview.js server-account-link.js \
            guiin-server-client.js guiin-server-data-client.js guiin-frontend-bridge.js golden-chart.test.js \
            engine-v2-contract.test.js ai-counsel-v2-regression.test.js server-money-regression.test.js \
            payment-entitlement-regression.test.js payment-recovery-regression.test.js \
            security-hardening-regression.test.js security-hardening-v2-regression.test.js \
            reliability-regression.test.js launch-gate-e2e.test.js frontend-server-bridge-regression.test.js \
            account-link-regression.test.js account-link-schema-regression.test.js \
            worker-v5.0-account-link-regression.test.js frontend-account-restore-regression.test.js \
            server-data-crud.js worker-v5.1-data-crud-preview.js data-crud-regression.test.js \
            worker-v5.1-data-crud-regression.test.js data-client-v2-regression.test.js \
            server-login-foundation.js server-logout.js worker-v5.2-login-foundation-preview.js \
            guiin-login-bridge.js login-foundation-regression.test.js login-foundation-schema-regression.test.js \
            worker-v5.2-login-foundation-regression.test.js frontend-login-bridge-regression.test.js \
            server-guest-conversion.js cloudflare-staging-config.js worker-v5.3-staging-preview.js \
            staging-config-regression.test.js worker-v5.3-staging-regression.test.js \
            guest-conversion-compat-regression.test.js server-authority-transition.js guiin-authority-bridge.js \
            worker-v5.4-authority-transition-preview.js authority-transition-regression.test.js \
            frontend-authority-bridge-regression.test.js worker-v5.4-authority-regression.test.js \
            authority-schema-regression.test.js server-pg-adapter.js server-webhook-signature.js \
            worker-v5.5-pg-test-preview.js pg-test-regression.test.js webhook-signature-regression.test.js \
            worker-v5.5-pg-regression.test.js pg-schema-regression.test.js server-legal-readiness.js \
            worker-v5.6-legal-failure-gate-preview.js legal-readiness-regression.test.js \
            legal-docs-regression.test.js failure-scenario-regression.test.js \
            worker-v5.6-legal-regression.test.js legal-schema-regression.test.js server-final-launch-gate.js \
            worker-v6.0-final-launch-preview.js final-launch-gate-regression.test.js \
            final-stage-regression.test.js final-status-regression.test.js worker-v6-final-regression.test.js \
            final-schema-regression.test.js
          do
            node --check "$f"
          done
      - name: Regression tests
        run: |
          set -e
          node golden-chart.test.js
          node engine-v2-contract.test.js
          node ai-counsel-v2-regression.test.js
          node server-money-regression.test.js
          node payment-entitlement-regression.test.js
          node payment-recovery-regression.test.js
          node security-hardening-regression.test.js
          node security-hardening-v2-regression.test.js
          node reliability-regression.test.js
          node launch-gate-e2e.test.js
          node frontend-server-bridge-regression.test.js
          node account-link-regression.test.js
          node account-link-schema-regression.test.js
          node worker-v5.0-account-link-regression.test.js
          node frontend-account-restore-regression.test.js
          node data-crud-regression.test.js
          node worker-v5.1-data-crud-regression.test.js
          node data-client-v2-regression.test.js
          node login-foundation-regression.test.js
          node login-foundation-schema-regression.test.js
          node worker-v5.2-login-foundation-regression.test.js
          node frontend-login-bridge-regression.test.js
          node staging-config-regression.test.js
          node worker-v5.3-staging-regression.test.js
          node guest-conversion-compat-regression.test.js
          node authority-transition-regression.test.js
          node frontend-authority-bridge-regression.test.js
          node worker-v5.4-authority-regression.test.js
          node authority-schema-regression.test.js
          node pg-test-regression.test.js
          node webhook-signature-regression.test.js
          node worker-v5.5-pg-regression.test.js
          node pg-schema-regression.test.js
          node legal-readiness-regression.test.js
          node legal-docs-regression.test.js
          node failure-scenario-regression.test.js
          node worker-v5.6-legal-regression.test.js
          node legal-schema-regression.test.js
          node final-launch-gate-regression.test.js
          node final-stage-regression.test.js
          node final-status-regression.test.js
          node worker-v6-final-regression.test.js
          node final-schema-regression.test.js
          python account-link-smoke.py
          python data-crud-smoke.py
          python login-foundation-smoke.py
          python staging-init-smoke.py
          python authority-transition-smoke.py
          python pg-test-smoke.py
          python legal-smoke.py
          python final-launch-smoke.py

      - name: Final launch must remain fail-closed
        shell: python
        run: |
          import json,sys
          x=json.load(open("FINAL-LAUNCH-STATUS.json",encoding="utf-8"))
          if x.get("payments_allowed") is not False:
            print("real payments must remain OFF before external gates pass");sys.exit(1)
          if x.get("launch_ready") is not False:
            print("production launch must remain blocked before external gates pass");sys.exit(1)
          if x.get("code_ready") is not True:
            print("expected code foundation to be 30/30 ready");sys.exit(1)
          print("final launch is safely fail-closed")
      - name: Sitemap uses .html paths
        run: |
          set -e
          if grep -E 'gwiinsaju.com/(today|manse|compatibility)/<' sitemap.xml; then
            echo "sitemap still uses folder URLs"; exit 1
          fi
          echo "sitemap ok"
