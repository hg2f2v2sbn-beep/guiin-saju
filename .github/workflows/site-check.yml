name: site-check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          set -e
          for f in \
            index.html saju-engine.js saju-engine-v2-patch.js guiin-engine-contract.js guiin-quality-gate.js \
            guiin-runtime-v2.css flow-v2.js expert-interpreter.js expert-v2.js compatibility-interpreter.js compatibility-v2.js \
            manse-view.js flow-timeline.js worker.js worker-v3-foundation.js worker-v3-data-foundation.js \
            worker-v3-unified-foundation.js worker-v4-integrated-preview.js worker-v4.1-persistence-preview.js worker-v4.2-ai-transaction-preview.js worker-v4.3-accounting-preview.js \
            server-contracts.js server-money.js server-schema.sql server-auth.js server-api-contracts.js \
            server-chart-authority.js server-ai-persistence.js server-ai-transaction.js server-accounting.js \
            server-profile.js server-conversation.js server-guest-conversion.js server-session.js server-ownership.js \
            server-d1-bootstrap.sql server-data-migration.sql server-unified-migration-v2.sql server-chart-ai-migration-v1.sql \
            server-ai-transaction-migration-v1.sql server-accounting-v2-migration.sql server-d1-safe-bootstrap.sql server-d1-init.sql \
            wrangler.example.toml cloudflare-bindings.example.json CLOUDFLARE-D1-DEPLOY.md \
            guiin-server-client.js guiin-server-data-client.js \
            golden-chart.test.js compatibility-regression.test.js flow-regression.test.js foundation-contract.test.js \
            engine-v2-contract.test.js engine-v2-integration.test.js v2-browser-regression.test.js \
            expert-v2-regression.test.js compat-v2-regression.test.js interpretation-browser-regression.test.js \
            ai-counsel-v2-regression.test.js server-money-regression.test.js server-schema-v2-regression.test.js \
            server-runtime-regression.test.js worker-v3-foundation-regression.test.js \
            server-profile-conversation-regression.test.js server-data-schema-regression.test.js worker-v3-data-foundation-regression.test.js \
            server-unified-regression.test.js server-unified-schema-regression.test.js worker-v3-unified-regression.test.js \
            integrated-schema-regression.test.js worker-v4-integrated-preview-regression.test.js \
            cloudflare-d1-readiness-regression.test.js d1-schema-smoke.py \
            chart-ai-persistence-regression.test.js chart-ai-persistence-schema-regression.test.js \
            worker-v4.1-persistence-regression.test.js chart-ai-persistence-smoke.py \
            ai-transaction-regression.test.js ai-transaction-schema-regression.test.js \
            worker-v4.2-ai-transaction-regression.test.js ai-transaction-smoke.py \
            server-accounting-regression.test.js server-accounting-schema-regression.test.js worker-v4.3-accounting-regression.test.js server-accounting-smoke.py \
            today.html manse.html compatibility.html 2026-fortune.html 2027-fortune.html cheon-eul-gwiin.html \
            saju-compatibility-guide.html sitemap.xml robots.txt CNAME brand-home.jpg
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: JavaScript syntax check
        run: |
          set -e
          for f in \
            saju-engine.js saju-engine-v2-patch.js guiin-engine-contract.js guiin-quality-gate.js flow-v2.js \
            expert-interpreter.js expert-v2.js compatibility-interpreter.js compatibility-v2.js manse-view.js flow-timeline.js \
            worker.js worker-v3-foundation.js worker-v3-data-foundation.js worker-v3-unified-foundation.js \
            worker-v4-integrated-preview.js worker-v4.1-persistence-preview.js worker-v4.2-ai-transaction-preview.js worker-v4.3-accounting-preview.js \
            server-contracts.js server-money.js server-auth.js server-api-contracts.js server-chart-authority.js \
            server-ai-persistence.js server-ai-transaction.js server-accounting.js server-profile.js server-conversation.js \
            server-guest-conversion.js server-session.js server-ownership.js guiin-server-client.js guiin-server-data-client.js \
            golden-chart.test.js compatibility-regression.test.js flow-regression.test.js foundation-contract.test.js \
            engine-v2-contract.test.js engine-v2-integration.test.js v2-browser-regression.test.js \
            expert-v2-regression.test.js compat-v2-regression.test.js interpretation-browser-regression.test.js \
            ai-counsel-v2-regression.test.js server-money-regression.test.js server-schema-v2-regression.test.js \
            server-runtime-regression.test.js worker-v3-foundation-regression.test.js \
            server-profile-conversation-regression.test.js server-data-schema-regression.test.js \
            worker-v3-data-foundation-regression.test.js server-unified-regression.test.js \
            server-unified-schema-regression.test.js worker-v3-unified-regression.test.js \
            integrated-schema-regression.test.js worker-v4-integrated-preview-regression.test.js \
            cloudflare-d1-readiness-regression.test.js chart-ai-persistence-regression.test.js \
            chart-ai-persistence-schema-regression.test.js worker-v4.1-persistence-regression.test.js \
            ai-transaction-regression.test.js ai-transaction-schema-regression.test.js \
            worker-v4.2-ai-transaction-regression.test.js server-accounting-regression.test.js server-accounting-schema-regression.test.js worker-v4.3-accounting-regression.test.js
          do
            node --check "$f"
          done

      - name: Regression tests
        run: |
          set -e
          node golden-chart.test.js
          node compatibility-regression.test.js
          node flow-regression.test.js
          node foundation-contract.test.js
          node engine-v2-contract.test.js
          node engine-v2-integration.test.js
          node v2-browser-regression.test.js
          node expert-v2-regression.test.js
          node compat-v2-regression.test.js
          node interpretation-browser-regression.test.js
          node ai-counsel-v2-regression.test.js
          node server-money-regression.test.js
          node server-schema-v2-regression.test.js
          node server-runtime-regression.test.js
          node worker-v3-foundation-regression.test.js
          node server-profile-conversation-regression.test.js
          node server-data-schema-regression.test.js
          node worker-v3-data-foundation-regression.test.js
          node server-unified-regression.test.js
          node server-unified-schema-regression.test.js
          node worker-v3-unified-regression.test.js
          node integrated-schema-regression.test.js
          node worker-v4-integrated-preview-regression.test.js
          node cloudflare-d1-readiness-regression.test.js
          python d1-schema-smoke.py
          node chart-ai-persistence-regression.test.js
          node chart-ai-persistence-schema-regression.test.js
          node worker-v4.1-persistence-regression.test.js
          python chart-ai-persistence-smoke.py
          node ai-transaction-regression.test.js
          node ai-transaction-schema-regression.test.js
          node worker-v4.2-ai-transaction-regression.test.js server-accounting-regression.test.js server-accounting-schema-regression.test.js worker-v4.3-accounting-regression.test.js
          python ai-transaction-smoke.py
          node server-accounting-regression.test.js
          node server-accounting-schema-regression.test.js
          node worker-v4.3-accounting-regression.test.js
          python server-accounting-smoke.py

      - name: No obvious committed API secrets
        shell: python
        run: |
          import pathlib, re, sys
          pats = [
            re.compile(r"sk-proj-[A-Za-z0-9_-]{12,}"),
            re.compile(r"\bsk-[A-Za-z0-9]{20,}\b"),
            re.compile(r"OPENAI_API_KEY\s*=\s*[\"'][^\"']+[\"']")
          ]
          exts={".jpg",".jpeg",".png",".webp",".gif",".zip",".pdf"}
          hits=[]
          for p in pathlib.Path(".").rglob("*"):
            if ".git" in p.parts or not p.is_file() or p.suffix.lower() in exts:
              continue
            try:
              content=p.read_text(encoding="utf-8",errors="ignore")
            except Exception:
              continue
            if any(rx.search(content) for rx in pats):
              hits.append(str(p))
          if hits:
            print("possible secret found:",*hits,sep="\n")
            sys.exit(1)
          print("no obvious committed API secrets")

      - name: Sitemap uses .html paths
        run: |
          set -e
          if grep -E 'gwiinsaju.com/(today|manse|compatibility)/<' sitemap.xml; then
            echo "sitemap still uses folder URLs"
            exit 1
          fi
          echo "sitemap ok"
