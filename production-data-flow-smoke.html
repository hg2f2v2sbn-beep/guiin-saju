<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<title>귀인사주 Production Data Flow Test</title>
<style>
:root{--bg:#fffaf1;--paper:#fffefa;--ink:#203128;--sub:#7c837d;--green:#0b6b4f;--line:#ece5d7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 28px rgba(62,53,40,.08)}
h1{font-size:22px;margin:0 0 10px;color:var(--green)}
p{color:var(--sub);line-height:1.65;font-size:14px}
button{width:100%;border:0;border-radius:14px;padding:15px;background:var(--green);color:white;font-weight:900;font-size:16px}
button:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;background:#f4f7f2;border-radius:14px;padding:14px;font-size:12px;line-height:1.55;min-height:220px}
.ok{color:#17603d}.bad{color:#9a3e35}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🍀 Production 데이터 흐름 테스트</h1>
    <p>Production 세션으로 명식 스냅샷 생성/조회 → 대화 생성 → 메시지 저장/조회 → 대화 삭제까지 한 번에 검사합니다.</p>
    <button id="run">테스트 시작</button>
    <pre id="out">대기 중…</pre>
  </div>
</div>
<script>
(function(){
  'use strict';
  const API='https://guiin-saju-api.blue-wls.workers.dev';
  const KEY='guiin_user_session_production_v1';
  const btn=document.getElementById('run');
  const out=document.getElementById('out');

  function log(v, cls){
    out.className=cls||'';
    out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);
  }

  function readSession(){
    try{
      const raw=localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null';
      const s=JSON.parse(raw);
      return s&&typeof s.token==='string'&&s.token.startsWith('usr_')?s:null;
    }catch(_e){return null;}
  }

  async function call(path,opt,token){
    const headers=Object.assign({'Accept':'application/json'},opt&&opt.headers||{});
    if(token)headers['Authorization']='Bearer '+token;
    const r=await fetch(API+path,Object.assign({},opt||{},{mode:'cors',cache:'no-store',headers}));
    const d=await r.json().catch(()=>({}));
    return {r,d};
  }

  btn.addEventListener('click',async()=>{
    btn.disabled=true;
    const session=readSession();
    const result={
      productionSession:!!session,
      apiMeAuthenticated:false,
      chartCreateStatus:null,
      chartCreateOk:false,
      chartGetStatus:null,
      chartGetOk:false,
      conversationCreateStatus:null,
      conversationCreateOk:false,
      messageCreateStatus:null,
      messageCreateOk:false,
      messageListStatus:null,
      messageFound:false,
      conversationDeleteStatus:null,
      conversationDeleteOk:false,
      conversationAbsentAfterDelete:false,
      error:null
    };

    let chartSnapshotId=null;
    let conversationId=null;

    if(!session){
      result.error='production_session_missing';
      result.allPassed=false;
      log(result,'bad');
      btn.disabled=false;
      return;
    }

    try{
      log('1/8 Production 로그인 세션 확인 중…');
      const me=await call('/api/me',{method:'GET'},session.token);
      result.apiMeAuthenticated=!!(me.r.ok&&me.d.authenticated===true);
      if(!result.apiMeAuthenticated)throw new Error(me.d.error||('api_me_http_'+me.r.status));

      log('2/8 명식 스냅샷 생성 중…');
      const unique='prod-flow-'+Date.now();
      const snap=await call('/api/chart-snapshots',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          normalized_input:{
            test_id:unique,
            calendar:'solar',
            birth_date:'2000-01-01',
            birth_time:'12:00',
            timezone:'Asia/Seoul'
          },
          chart_facts:{
            schema_version:'2.0.0',
            pillars:{year:'甲子',month:'乙丑',day:'丙寅',hour:'丁卯'},
            day_master:{stem:'丙'},
            element_distribution:{wood:2,fire:2,earth:1,metal:0,water:1},
            uncertainty:{smoke_test:true}
          },
          uncertainty:{smoke_test:true},
          calculation_engine_version:'production-smoke',
          calculation_rule_version:'production-smoke-v1'
        })
      },session.token);

      result.chartCreateStatus=snap.r.status;
      result.chartCreateOk=!!(snap.r.ok&&snap.d.ok&&snap.d.chartSnapshotId);
      if(!result.chartCreateOk)throw new Error(snap.d.error||('chart_create_http_'+snap.r.status));
      chartSnapshotId=snap.d.chartSnapshotId;

      log('3/8 명식 스냅샷 조회 중…');
      const snapGet=await call('/api/chart-snapshots/'+encodeURIComponent(chartSnapshotId),{method:'GET'},session.token);
      result.chartGetStatus=snapGet.r.status;
      result.chartGetOk=!!(snapGet.r.ok&&snapGet.d.ok&&snapGet.d.chartSnapshot&&snapGet.d.chartSnapshot.id===chartSnapshotId);
      if(!result.chartGetOk)throw new Error(snapGet.d.error||('chart_get_http_'+snapGet.r.status));

      log('4/8 대화 생성 중…');
      const conv=await call('/api/conversations',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          title:'Production 데이터 흐름 테스트',
          chart_snapshot_id:chartSnapshotId
        })
      },session.token);

      result.conversationCreateStatus=conv.r.status;
      result.conversationCreateOk=!!(conv.r.ok&&conv.d.ok&&conv.d.conversation&&conv.d.conversation.id);
      if(!result.conversationCreateOk)throw new Error(conv.d.error||('conversation_create_http_'+conv.r.status));
      conversationId=conv.d.conversation.id;

      log('5/8 메시지 저장 중…');
      const messageRequestId='prod_msg_'+(crypto.randomUUID?crypto.randomUUID():Date.now());
      const msg=await call('/api/conversations/'+encodeURIComponent(conversationId)+'/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          content:'Production 메시지 저장 테스트',
          requestId:messageRequestId
        })
      },session.token);

      result.messageCreateStatus=msg.r.status;
      result.messageCreateOk=!!(msg.r.ok&&msg.d.ok&&msg.d.message&&msg.d.message.id);
      if(!result.messageCreateOk)throw new Error(msg.d.error||('message_create_http_'+msg.r.status));
      const messageId=msg.d.message.id;

      log('6/8 메시지 조회 중…');
      const msgList=await call('/api/conversations/'+encodeURIComponent(conversationId)+'/messages',{method:'GET'},session.token);
      result.messageListStatus=msgList.r.status;
      const messages=Array.isArray(msgList.d.messages)?msgList.d.messages:[];
      result.messageFound=messages.some(m=>m&&m.id===messageId&&m.content==='Production 메시지 저장 테스트');
      if(!msgList.r.ok||!msgList.d.ok||!result.messageFound)throw new Error(msgList.d.error||'message_not_found_after_create');

      log('7/8 대화 삭제 중…');
      const del=await call('/api/conversations/'+encodeURIComponent(conversationId),{method:'DELETE'},session.token);
      result.conversationDeleteStatus=del.r.status;
      result.conversationDeleteOk=!!(del.r.ok&&del.d.ok&&del.d.deleted===true);
      if(!result.conversationDeleteOk)throw new Error(del.d.error||('conversation_delete_http_'+del.r.status));

      log('8/8 삭제 후 대화 목록 확인 중…');
      const convList=await call('/api/conversations',{method:'GET'},session.token);
      const convs=Array.isArray(convList.d.conversations)?convList.d.conversations:[];
      result.conversationAbsentAfterDelete=!!(convList.r.ok&&convList.d.ok&&!convs.some(c=>c&&c.id===conversationId));
      if(!result.conversationAbsentAfterDelete)throw new Error(convList.d.error||'conversation_still_visible_after_delete');

      result.chartSnapshotId=chartSnapshotId;
      result.conversationId=conversationId;
      result.note='명식 스냅샷 테스트 행 1개는 Production DB에 남습니다. 최종 정리 단계에서 삭제하면 됩니다.';
      result.allPassed=true;
      log(result,'ok');
    }catch(e){
      result.error=String(e&&e.message||e||'unknown_error');
      result.chartSnapshotId=chartSnapshotId;
      result.conversationId=conversationId;

      if(conversationId && !result.conversationDeleteOk){
        try{
          const cleanup=await call('/api/conversations/'+encodeURIComponent(conversationId),{method:'DELETE'},session.token);
          result.cleanupConversationDeleteStatus=cleanup.r.status;
          result.cleanupConversationDeleteOk=!!(cleanup.r.ok&&cleanup.d.ok);
        }catch(_e){}
      }

      result.allPassed=false;
      log(result,'bad');
    }finally{
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
