name: engine-v3-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-v3-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Required core files
        run: |
          set -e
          for f in \
            index.html demo.html \
            saju-engine.js saju-engine-v2-patch.js guiin-engine-contract.js \
            expert-interpreter.js compatibility-interpreter.js deep-interpretation-v3.js \
            flow-timeline.js \
            golden-chart.test.js engine-v2-contract.test.js engine-v2-integration.test.js \
            flow-regression.test.js compatibility-regression.test.js \
            engine-final-gate.test.js deep-v3-regression.test.js
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done

      - name: Core JavaScript syntax
        run: |
          set -e
          for f in \
            saju-engine.js saju-engine-v2-patch.js guiin-engine-contract.js \
            expert-interpreter.js compatibility-interpreter.js deep-interpretation-v3.js \
            flow-timeline.js engine-final-gate.test.js deep-v3-regression.test.js
          do
            node --check "$f"
          done

      - name: Existing calculation baselines
        run: |
          set -e
          node golden-chart.test.js
          node engine-v2-contract.test.js
          node engine-v2-integration.test.js
          node flow-regression.test.js
          node compatibility-regression.test.js

      - name: Engine final gate
        run: node engine-final-gate.test.js

      - name: Deep V3 interpretation gate
        run: node deep-v3-regression.test.js
