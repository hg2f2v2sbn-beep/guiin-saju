<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>귀인사주 v6.29 출시 QA</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f8f4e9;color:#253b31;margin:0}.wrap{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #eadfca;border-radius:18px;padding:16px;margin:10px 0}h1{font-size:24px}h2{font-size:17px}.ok{color:#177447}.bad{color:#bb3d44}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border:0}button{border:0;border-radius:13px;padding:11px 14px;background:#0d5b46;color:#fff;font-weight:800}.manual label{display:block;padding:8px 0}small{color:#777}</style></head><body><main class="wrap"><h1>☘ 귀인사주 v6.29 출시 전 QA</h1><p>실결제 플래그는 켜지 않고 자동 점검 + 실제 기기 수동 점검을 분리해서 확인해.</p><div class="card"><button id="run">자동 점검 실행</button><div id="auto"></div></div><div class="card manual"><h2>수동 확인이 꼭 필요한 항목</h2><label><input type="checkbox"> iPhone Safari에서 작은 화면/노치/하단바 겹침 없음</label><label><input type="checkbox"> 카카오 인앱브라우저에서 로그인/뒤로가기 정상</label><label><input type="checkbox"> 로그인 만료 뒤 재로그인 시 결과/상담 복구</label><label><input type="checkbox"> 결제창에서 뒤로가기 후 중복 주문 생성 안 됨</label><label><input type="checkbox"> 결제 버튼 연속 탭해도 중복 결제 안 됨</label><label><input type="checkbox"> 승인 후 평생사주/궁합 권한 즉시 반영</label><label><input type="checkbox"> AI 무료/유료 이용권이 정확히 1회씩 차감</label><label><input type="checkbox"> 새로고침 후 구매/이용권 상태 유지</label><label><input type="checkbox"> 네트워크 오류 후 같은 결제를 재승인하지 않고 복구 가능</label></div><div class="card"><b>중요</b><p>토스 실가맹점 승인과 별개로, 위 항목과 서버 launch gate를 확인하기 전에는 NEW_PAYMENTS_ENABLED를 켜지 않아.</p></div></main><script>
async function run(){const host=document.getElementById('auto');host.innerHTML='<p>확인 중…</p>';const rows=[];const add=(n,o,d='')=>rows.push([n,!!o,d]);try{const [main,demo]=await Promise.all([fetch('/',{cache:'no-store'}).then(r=>r.text()),fetch('/demo.html',{cache:'no-store'}).then(r=>r.text())]);add('메인 v6.29 파일',main.includes('guiin-growth-v6.29.js'));add('데모 v6.29 파일',demo.includes('guiin-growth-v6.29.js'));add('메인/데모 분리',!main.includes('DEMO · 전체풀이 무료')&&demo.includes('DEMO · 전체풀이 무료'));}catch(e){add('사이트 파일 확인',false,String(e))}try{const h=await fetch('https://guiin-saju-api.blue-wls.workers.dev/health',{cache:'no-store'}).then(r=>r.json());add('Worker health',h.ok,h.version||'');add('DB',h.databaseReady);add('서버 회계',h.serverAccountingReady);add('상품 DB',h.productCatalogReady);add('실결제 안전 비활성',h.paymentsEnabled===false&&h.liveCheckoutReady===false,'toss='+String(h.tossKeyMode||'-'));}catch(e){add('Worker health',false,String(e))}host.innerHTML=rows.map(r=>`<div class="row"><span>${r[0]}<br><small>${r[2]||''}</small></span><b class="${r[1]?'ok':'bad'}">${r[1]?'PASS':'CHECK'}</b></div>`).join('');}document.getElementById('run').onclick=run;
</script></body></html>
