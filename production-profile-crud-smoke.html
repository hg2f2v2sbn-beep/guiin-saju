<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<title>귀인사주 Production Profile CRUD Test</title>
<style>
:root{--bg:#fffaf1;--paper:#fffefa;--ink:#203128;--sub:#7c837d;--green:#0b6b4f;--line:#ece5d7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 28px rgba(62,53,40,.08)}
h1{font-size:22px;margin:0 0 10px;color:var(--green)}
p{color:var(--sub);line-height:1.6;font-size:14px}
button{width:100%;border:0;border-radius:14px;padding:15px;background:var(--green);color:white;font-weight:900;font-size:16px}
button:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;background:#f4f7f2;border-radius:14px;padding:14px;font-size:12px;line-height:1.55;min-height:180px}
.ok{color:#17603d}.bad{color:#9a3e35}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🍀 Production 프로필 CRUD 테스트</h1>
    <p>테스트용 프로필을 1개 생성 → 목록에서 확인 → 삭제 → 다시 목록에서 사라졌는지 확인합니다. 기존 프로필은 건드리지 않습니다.</p>
    <button id="run">테스트 시작</button>
    <pre id="out">대기 중…</pre>
  </div>
</div>
<script>
(function(){
  'use strict';
  const API='https://guiin-saju-api.blue-wls.workers.dev';
  const KEY='guiin_user_session_production_v1';
  const btn=document.getElementById('run');
  const out=document.getElementById('out');

  function log(v, cls){
    out.className=cls||'';
    out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);
  }

  function readSession(){
    try{
      const raw=localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null';
      const s=JSON.parse(raw);
      return s&&typeof s.token==='string'&&s.token.startsWith('usr_')?s:null;
    }catch(_e){return null;}
  }

  async function call(path,opt,token){
    const headers=Object.assign({'Accept':'application/json'},opt&&opt.headers||{});
    if(token)headers['Authorization']='Bearer '+token;
    const r=await fetch(API+path,Object.assign({},opt||{},{mode:'cors',cache:'no-store',headers}));
    const d=await r.json().catch(()=>({}));
    return {r,d};
  }

  btn.addEventListener('click',async()=>{
    btn.disabled=true;
    const session=readSession();
    if(!session){
      log('Production 로그인 세션이 없습니다. 먼저 Production 카카오 로그인 테스트를 완료해 주세요.','bad');
      btn.disabled=false;
      return;
    }

    let profileId=null;
    const result={
      productionSession:true,
      apiMeAuthenticated:false,
      createStatus:null,
      createOk:false,
      listAfterCreateStatus:null,
      foundAfterCreate:false,
      deleteStatus:null,
      deleteOk:false,
      listAfterDeleteStatus:null,
      absentAfterDelete:false,
      cleanupAttempted:false,
      error:null
    };

    try{
      log('1/5 Production 로그인 세션 확인 중…');
      const me=await call('/api/me',{method:'GET'},session.token);
      result.apiMeAuthenticated=!!(me.r.ok&&me.d.authenticated===true);
      if(!result.apiMeAuthenticated)throw new Error(me.d.error||('api_me_http_'+me.r.status));

      log('2/5 테스트 프로필 생성 중…');
      const unique='prod-crud-'+Date.now();
      const create=await call('/api/profiles',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          label:'Production CRUD Test '+unique,
          display_name:'테스트프로필',
          calendar:'양력',
          birth_year:2000,
          birth_month:1,
          birth_day:1,
          birth_hour:12,
          birth_minute:0,
          hour_unknown:false,
          gender:'테스트',
          timezone:'Asia/Seoul',
          day_boundary:'23',
          true_solar_time:false
        })
      },session.token);

      result.createStatus=create.r.status;
      result.createOk=!!(create.r.ok&&create.d.ok&&create.d.profile&&create.d.profile.id);
      if(!result.createOk)throw new Error(create.d.error||('profile_create_http_'+create.r.status));
      profileId=create.d.profile.id;

      log('3/5 생성된 프로필 목록 확인 중…');
      const list1=await call('/api/profiles',{method:'GET'},session.token);
      result.listAfterCreateStatus=list1.r.status;
      const profiles1=Array.isArray(list1.d.profiles)?list1.d.profiles:[];
      result.foundAfterCreate=profiles1.some(p=>p&&p.id===profileId);
      if(!list1.r.ok||!list1.d.ok||!result.foundAfterCreate)throw new Error(list1.d.error||'profile_not_found_after_create');

      log('4/5 테스트 프로필 삭제 중…');
      result.cleanupAttempted=true;
      const del=await call('/api/profiles/'+encodeURIComponent(profileId),{method:'DELETE'},session.token);
      result.deleteStatus=del.r.status;
      result.deleteOk=!!(del.r.ok&&del.d.ok&&del.d.deleted===true);
      if(!result.deleteOk)throw new Error(del.d.error||('profile_delete_http_'+del.r.status));

      log('5/5 삭제 후 목록 재확인 중…');
      const list2=await call('/api/profiles',{method:'GET'},session.token);
      result.listAfterDeleteStatus=list2.r.status;
      const profiles2=Array.isArray(list2.d.profiles)?list2.d.profiles:[];
      result.absentAfterDelete=!profiles2.some(p=>p&&p.id===profileId);
      if(!list2.r.ok||!list2.d.ok||!result.absentAfterDelete)throw new Error(list2.d.error||'profile_still_visible_after_delete');

      result.profileId=profileId;
      result.allPassed=true;
      log(result,'ok');
    }catch(e){
      result.error=String(e&&e.message||e||'unknown_error');

      if(profileId && !result.deleteOk){
        try{
          result.cleanupAttempted=true;
          const cleanup=await call('/api/profiles/'+encodeURIComponent(profileId),{method:'DELETE'},session.token);
          result.cleanupDeleteStatus=cleanup.r.status;
          result.cleanupDeleteOk=!!(cleanup.r.ok&&cleanup.d.ok);
        }catch(_e){}
      }

      result.profileId=profileId;
      result.allPassed=false;
      log(result,'bad');
    }finally{
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
