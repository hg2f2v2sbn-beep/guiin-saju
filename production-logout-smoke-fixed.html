<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf1">
<title>귀인사주 Production Logout Test Fixed</title>
<style>
:root{--bg:#fffaf1;--paper:#fffefa;--ink:#203128;--sub:#7c837d;--green:#0b6b4f;--line:#ece5d7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
.wrap{max-width:540px;margin:0 auto;padding:24px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 28px rgba(62,53,40,.08)}
h1{font-size:22px;margin:0 0 10px;color:var(--green)}
p{color:var(--sub);line-height:1.65;font-size:14px}
button{width:100%;border:0;border-radius:14px;padding:15px;background:var(--green);color:white;font-weight:900;font-size:16px}
button:disabled{opacity:.5}
pre{white-space:pre-wrap;word-break:break-word;background:#f4f7f2;border-radius:14px;padding:14px;font-size:12px;line-height:1.55;min-height:220px}
.ok{color:#17603d}.bad{color:#9a3e35}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🍀 Production 로그아웃 테스트</h1>
    <p>현재 Production 세션을 서버에서 폐기한 뒤, 같은 토큰으로 다시 /api/me를 호출했을 때 인증이 거부되는지 확인합니다. 테스트 후 Production 로그인은 다시 한 번 해야 합니다.</p>
    <button id="run">로그아웃 테스트 시작</button>
    <pre id="out">대기 중…</pre>
  </div>
</div>
<script>
(function(){
  'use strict';
  const API='https://guiin-saju-api.blue-wls.workers.dev';
  const KEY='guiin_user_session_production_v1';
  const VERIFIED_KEY='guiin_verified_user_production_v1';
  const btn=document.getElementById('run');
  const out=document.getElementById('out');

  function log(v, cls){
    out.className=cls||'';
    out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2);
  }

  function readSession(){
    try{
      const raw=localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null';
      const s=JSON.parse(raw);
      return s&&typeof s.token==='string'&&s.token.startsWith('usr_')?s:null;
    }catch(_e){return null;}
  }

  async function call(path,opt,token){
    const headers=Object.assign({'Accept':'application/json'},opt&&opt.headers||{});
    if(token)headers['Authorization']='Bearer '+token;
    const r=await fetch(API+path,Object.assign({},opt||{},{mode:'cors',cache:'no-store',headers}));
    const d=await r.json().catch(()=>({}));
    return {r,d};
  }

  btn.addEventListener('click',async()=>{
    btn.disabled=true;
    const s=readSession();
    const result={
      productionSessionBefore:!!s,
      apiMeBeforeAuthenticated:false,
      logoutStatus:null,
      logoutOk:false,
      apiMeAfterStatus:null,
      revokedTokenRejected:false,
      localSessionCleared:false,
      error:null
    };

    if(!s){
      result.error='production_session_missing';
      result.allPassed=false;
      log(result,'bad');
      btn.disabled=false;
      return;
    }

    try{
      log('1/3 현재 Production 세션 확인 중…');
      const before=await call('/api/me',{method:'GET'},s.token);
      result.apiMeBeforeAuthenticated=!!(before.r.ok&&before.d.authenticated===true);
      if(!result.apiMeBeforeAuthenticated)throw new Error(before.d.error||('api_me_before_http_'+before.r.status));

      log('2/3 Production 로그아웃 처리 중…');
      const logout=await call('/api/auth/logout',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:'{}'
      },s.token);
      result.logoutStatus=logout.r.status;
      result.logoutOk=!!(logout.r.ok&&logout.d.ok&&logout.d.loggedOut===true);
      if(!result.logoutOk)throw new Error(logout.d.error||('logout_http_'+logout.r.status));

      log('3/3 폐기된 토큰 재사용 차단 확인 중…');
      const after=await call('/api/me',{method:'GET'},s.token);
      result.apiMeAfterStatus=after.r.status;
      result.revokedTokenRejected=(after.r.status===401 && after.d.authenticated===false);

      try{
        localStorage.removeItem(KEY);
        sessionStorage.removeItem(KEY);
        localStorage.removeItem(VERIFIED_KEY);
        sessionStorage.removeItem(VERIFIED_KEY);
      }catch(_e){}

      result.localSessionCleared=!readSession();
      if(!result.revokedTokenRejected)throw new Error(after.d.error||('revoked_token_not_rejected_http_'+after.r.status));
      if(!result.localSessionCleared)throw new Error('local_session_clear_failed');

      result.allPassed=true;
      log(result,'ok');
    }catch(e){
      result.error=String(e&&e.message||e||'unknown_error');
      result.allPassed=false;
      log(result,'bad');
    }finally{
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
